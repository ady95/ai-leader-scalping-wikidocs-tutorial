# 프로젝트 설정 (01-4)
# 숫자는 출처를 주석으로 밝힌다: [공개] 공개 영상의 원칙, [실험값] 이 책의 연구 가설, [가정] 확인이 필요한 값

account:
  equity: 10000000            # 가상 계좌 1,000만 원
  risk_per_trade: 0.0025      # [실험값] 1회 위험비율 0.25% — 1회 최대 손실 2만 5천 원
  max_position_ratio: 0.30    # [실험값] 한 종목에 계좌의 30%까지
  liquidity_ratio: 0.01       # [실험값] 주문 금액은 기준봉 1분 거래대금의 1%까지 (05-3)

costs:                        # [가정] 증권사·세법에 따라 다르다. 부록 B에서 확인
  commission: 0.00015         # 매수·매도 수수료 0.015%
  sell_tax: 0.0020            # 매도 거래세 0.20%
  slippage_ticks: 1           # 주문할 때마다 불리한 쪽으로 호가 1칸

leaders:                      # 주도주 후보 (02장)
  min_ret: 0.05               # [실험값] 상승 종목 기준 +5%
  min_up: 2                   # [실험값] 함께 오르는 종목이 2개 이상이어야 테마로 본다 ([공개] 주도 섹터를 보라)
  min_price: 1000             # [실험값] 1,000원 미만 저가주 제외
  min_value: 5000000000       # [실험값] 1위 후보 누적 거래대금 50억 미만이면 NO_TRADE
  market_drop: -0.015         # [실험값] 지수(ETF)가 -1.5% 이하면 NO_TRADE
  top_k: 5                    # 스냅샷마다 남기는 후보 수
  every_minutes: 5            # 스냅샷 간격

b0:                           # 공개 전략 기준 전략 (01-3)
  no_entry_before: "09:30"    # [공개] 9시 30분 전에는 웬만하면 매매하지 않는다
  low_zone_max: 0.10          # [공개] 낮은 구간 — 영상 예시 "10% 전"
  high_zone_min: 0.15         # [실험값] 높은 구간 — 이보다 높으면 추격하지 않고 눌림을 기다린다
  breakout_valid_bars: 3      # [실험값] 기준봉 뒤 몇 개 봉 안에 고점을 돌파해야 하는가
  mid_zone_breakout: false    # [실험값] 중간 구간(10~15%)에서도 돌파를 살 것인가 (12장에서 비교)
  fast_stop_bars: 2           # [공개] 1~2분 안에 못 가면 자른다
  max_loss: 0.03              # [공개] 손실은 3% 안쪽
  no_news_take_profit: 0.03   # [공개] 뉴스 없이 대금만으로 갈 때는 3% 정도에 챙긴다
